name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Python analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: security-extended
          # The fixture starters deliberately contain bugs for agent evaluations.
          # Scan production/reference/tooling code; grade fixtures with their hidden tests.
          config: |
            paths-ignore:
              - evals/fixtures
              - evals/results
      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
          output: codeql-results
      - name: Report observed analysis findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = sorted(Path("codeql-results").glob("*.sarif"))
          if not reports:
              raise SystemExit("CodeQL produced no SARIF report")
          findings = []
          for path in reports:
              for run in json.loads(path.read_text())["runs"]:
                  findings.extend(run.get("results", []))
          print(f"CodeQL SARIF results: {len(findings)}")
          for result in findings:
              print(json.dumps({key: result.get(key) for key in ("ruleId", "level", "locations")}))
          PY
