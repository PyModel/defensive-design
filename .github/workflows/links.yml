name: links

# The package validator is offline by design, so cited sources can rot unnoticed.
# This checks them weekly; it is not a required check because it depends on other sites.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Fetch every external link in tracked Markdown
        run: python -m scripts.check_links --budget 90 --json "$RUNNER_TEMP/external-links.json"
      - name: Preserve verified, broken and unverified outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-link-results
          path: ${{ runner.temp }}/external-links.json
          if-no-files-found: warn
          retention-days: 7
