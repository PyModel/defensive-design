name: audit

# GitHub's dependency graph only recognizes `requirements.txt`, so it does not see
# requirements-dev.txt and Dependabot alerts cover none of the locked packages.
# This audits the hash lock directly; the weekly run catches new advisories
# against unchanged pins. GitHub disables scheduled runs after 60 days without repo activity.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # The auditor has its own hash lock so it never touches the tested baseline, and an
      # unpinned transitive dependency cannot turn the audit falsely green.
      - name: Install hash-locked pip-audit
        run: python -m pip install --require-hashes -r requirements-audit.txt
      # One run per lock: pip-audit rejects a package listed in two requirement files.
      - name: Audit the hash-locked maintainer dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.txt
      - name: Audit the hash-locked auditor dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-audit.txt
